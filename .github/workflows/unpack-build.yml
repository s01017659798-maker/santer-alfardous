name: Build Santer AlFardous Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'santer-alfardous-3.8.15-project.zip.b64'
      - '.github/workflows/unpack-build.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Decode and extract complete 3.8.15 project
        run: |
          set -euo pipefail
          test -s santer-alfardous-3.8.15-project.zip.b64
          base64 --decode santer-alfardous-3.8.15-project.zip.b64 > /tmp/santer-project.zip
          mkdir -p extracted
          unzip -q /tmp/santer-project.zip -d extracted
          APP_GRADLE=$(find extracted -type f -path '*/app/build.gradle' -print -quit)
          test -n "$APP_GRADLE"
          PROJECT_DIR="${APP_GRADLE%/app/build.gradle}"
          cp -a "$PROJECT_DIR"/. .
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/eg/alfardous/center/MainActivity.java
      - name: Run all regression and teacher workflow tests
        run: node --test tests/*.test.cjs
      - name: Check all inline JavaScript
        run: |
          python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path('app/src/main/assets/index.html').read_text()
          scripts = re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', html, re.I)
          pathlib.Path('/tmp/inline-js').mkdir(exist_ok=True)
          for i, source in enumerate(scripts):
              pathlib.Path(f'/tmp/inline-js/{i}.js').write_text(source)
          print(f'Extracted {len(scripts)} inline scripts')
          PY
          for file in /tmp/inline-js/*.js; do node --check "$file"; done
      - name: Build release APK (unsigned)
        run: gradle --no-daemon clean :app:assembleRelease
      - name: Align unsigned APK for final signing
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -type f -name '*unsigned.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo 'Unsigned release APK was not generated'
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -v 4 "$APK" app-release-unsigned-aligned.apk
          ls -lh app-release-unsigned-aligned.apk
      - name: Upload aligned APK for release signing and installation checks
        uses: actions/upload-artifact@v4
        with:
          name: santer-alfardous-3.8.15-release-unsigned-aligned
          path: app-release-unsigned-aligned.apk
          if-no-files-found: error
          retention-days: 7
